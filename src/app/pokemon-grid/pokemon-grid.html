<div class="grid">
  @for (item of pokemon(); track item.id) {
    <article class="pokemon-card">
      <span class="number">#{{ item.id.toString().padStart(4, '0') }}</span>
      <div class="image-wrap">
        <img [src]="item.imageUrl" [alt]="item.name | titlecase" loading="lazy" />
      </div>
      <h3>{{ item.name | titlecase }}</h3>
      <button type="button" disabled [title]="'Disponible al conectar la colección de ' + owner()">
        Agregar a colección
      </button>
    </article>
  }
</div>
